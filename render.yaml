# Render Blueprint: https://render.com/docs/blueprint-spec
# The Telegram bot uses a webhook here (Render's URL is detected), so incoming messages
# wake a sleeping free instance. The persistent disk keeps the YouCam result cache, demo
# videos and chat sessions across deploys and restarts. Disks need a paid instance; on the
# free plan, delete `disk` and CACHE_DIR, and expect results to be paid for again after
# each restart or sleep.
services:
  - type: web
    name: haircam
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CACHE_DIR
        value: /var/data/cache
      - key: YOUCAM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUCAM_TELEGRAM_BOT_TOKEN
        sync: false
    disk:
      name: haircam-cache
      mountPath: /var/data
      sizeGB: 1
